{% extends "base.html" %}

{% block title %}Admin Login — TECHBLITZ{% endblock %}

{% block content %}
<div class="container container-narrow" style="margin-top: 4rem; margin-bottom: 4rem;">
  <div class="card" style="box-shadow: 0 10px 30px rgba(0,0,0,0.5); border-top: 4px solid var(--accent);">
    
    <div style="text-align: center; margin-bottom: 2rem;">
      <div class="brand-logo" style="margin: 0 auto 1rem; width: 48px; height: 48px; font-size: 1.5rem; background: linear-gradient(135deg, var(--accent), var(--primary));">🛡️</div>
      <h2 style="font-size: 1.5rem; font-weight: 800; color: #ffffff;">ADMINISTRATOR PORTAL</h2>
      <p style="color: var(--text-secondary); font-size: 0.88rem; margin-top: 0.25rem;">
        Secure Control Center & Live Proctoring Dashboard
      </p>
    </div>

    <!-- Error Alert Box -->
    <div id="adminLoginError" style="display: none; background: var(--danger-bg); border: 1px solid var(--danger); color: #fca5a5; padding: 0.85rem 1rem; border-radius: var(--radius-md); margin-bottom: 1.5rem; font-size: 0.9rem;">
      <span id="adminLoginErrorText"></span>
    </div>

    <form id="adminLoginForm" onsubmit="handleAdminLogin(event)">
      <div class="form-group">
        <label class="form-label" for="adminUsername">Admin Username</label>
        <input 
          type="text" 
          id="adminUsername" 
          class="form-control" 
          placeholder="admin" 
          required 
          autocomplete="username"
        >
      </div>

      <div class="form-group">
        <label class="form-label" for="adminPassword">Password</label>
        <input 
          type="password" 
          id="adminPassword" 
          class="form-control" 
          placeholder="••••••••" 
          required 
          autocomplete="current-password"
        >
      </div>

      <div style="margin-top: 2rem;">
        <button type="submit" id="adminLoginBtn" class="btn btn-primary btn-lg btn-full" style="background: linear-gradient(135deg, var(--accent), var(--primary));">
          LOGIN TO DASHBOARD 🔐
        </button>
      </div>
    </form>

    <div style="margin-top: 1.75rem; padding-top: 1.25rem; border-top: 1px solid var(--border); text-align: center;">
      <p style="font-size: 0.8rem; color: var(--text-muted);">
        Authorized proctors and club administrators only.
      </p>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function handleAdminLogin(e) {
  e.preventDefault();
  const errBox = document.getElementById('adminLoginError');
  const errText = document.getElementById('adminLoginErrorText');
  const btn = document.getElementById('adminLoginBtn');

  errBox.style.display = 'none';
  btn.disabled = true;
  btn.textContent = 'Verifying Credentials...';

  const payload = {
    username: document.getElementById('adminUsername').value.trim(),
    password: document.getElementById('adminPassword').value.trim()
  };

  try {
    const res = await fetch('/api/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

    const data = await res.json();
    if (!res.ok || !data.success) {
      errBox.style.display = 'block';
      errText.textContent = data.error || 'Invalid administrator username or password.';
      btn.disabled = false;
      btn.textContent = 'LOGIN TO DASHBOARD 🔐';
      return;
    }

    window.location.href = data.redirect || '/admin';
  } catch (err) {
    errBox.style.display = 'block';
    errText.textContent = 'Network error contacting authentication server.';
    btn.disabled = false;
    btn.textContent = 'LOGIN TO DASHBOARD 🔐';
  }
}
</script>
{% endblock %}
